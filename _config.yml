# Configurations
title:            Creeds & Confessions
longtitle:        Creeds & Confessions
author:           Tyler
email:            heidelbergbot@gmail.com
description: >
  Searchable creeds, confessions, and catechisms of the church — the ecumenical
  creeds, the Westminster Standards, the Three Forms of Unity, and the OPC Book
  of Church Order.

version:          1.0
gitbook_version:  3.2.3
assets_version:   "20260729-5"

lang:             en

# Canonical origin. Every internal link must be relative or {{ site.baseurl }}-prefixed
# so that visitors stay on this domain rather than the github.io mirror.
url:              'https://creedsandconfessions.com'
baseurl:          ''
rss:              RSS

# bootstrap: use the remote theme for the site itself.
# Pinned by SHA: upstream publishes no tags, and an unpinned remote_theme lets an
# upstream commit change this site with no commit here and no way to roll back.
# Bump deliberately, and rebuild locally before pushing — several theme files are
# overridden in _layouts/ and _includes/ and can drift out of sync.
remote_theme: sighingnow/jekyll-gitbook@a7d876936fe650c46eaf9eca92dc7afe0f1e1f17

toc:
  enabled: true
  h_min: 1
  h_max: 3

# Sidebar group headings, keyed by the `category` in each page's front matter.
# Groups appear in collection order (see collections.pages.order below), not in
# the order listed here.
nav_group_titles:
  ecumenical-creeds:     The Ecumenical Creeds
  westminster-standards: The Westminster Standards
  three-forms-of-unity:  The Three Forms of Unity
  book-of-church-order:  The OPC Book of Church Order

# customize the link favicon in header, will be {{site.baseurl}}/{{site.favicon_path}}
favicon_path:     /assets/gitbook/images/favicon.ico

# Default social preview card. Deliberately typographic rather than the OPC seal —
# this site is not an OPC property and should not present itself as one.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-card.png

# markdown render engine.
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:                /:categories/:year-:month-:day-:title:output_ext

exclude:
  - _drafts
  # ruby/setup-ruby's bundler-cache installs gems into vendor/ inside the
  # workspace. Without this, Jekyll reads them as site content and the build
  # dies on Jekyll's own site_template post, whose front matter holds an ERB
  # date placeholder rather than a date.
  - vendor
  # Repo furniture that is not part of the site.
  - Gemfile
  - Gemfile.lock
  - script
  - README.md
  - LICENSE

collections:
  pages:
    output: true
    permalink: /:collection/:path/

    # NOTE: do not reintroduce an `order:` list here. Jekyll 4 honours it
    # (Collection#sort_docs!), but GitHub Pages builds this site with Jekyll
    # 3.10, which ignores it silently — so it works locally and does nothing in
    # production, where documents fall back to date-then-path order. Ordering
    # lives in each page's `nav_order` instead; _includes/toc-date.html and
    # _layouts/post.html both sort on it explicitly.

page_width: 70ch

destination:      ./_site
incremental:      false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji
