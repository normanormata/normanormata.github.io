<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Creeds & Confessions monogram, in the colours of assets/og-card.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3951"/>
      <stop offset="1" stop-color="#132639"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect width="64" height="5" fill="#c9a84c"/>
  </g>
  <text x="32" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" letter-spacing="-2" fill="#f4efe4">C<tspan fill="#c9a84c" font-weight="normal" font-style="italic" font-size="23">&amp;</tspan>C</text>
</svg>
